<div class="ui dlg-host pk-dlg">
  <anvil-component type="Label" name="title" prop:role='["dlg-title"]' prop:text="Plan the pickup"></anvil-component>
  <anvil-component type="Label" name="text" prop:role='["fine-print", "dlg-text"]'></anvil-component>
  <div class="ui-stack">
    <div class="pk-when">
      <label class="ui-field"><span>Day</span>
        <anvil-component type="DropDown" name="day_box"></anvil-component>
      </label>
      <label class="ui-field"><span>Time</span>
        <anvil-component type="DropDown" name="time_box"></anvil-component>
      </label>
    </div>
    <label class="ui-field"><span>Where to meet</span>
      <anvil-component type="TextBox" name="place_box" prop:placeholder="e.g. Laurier metro, main entrance"></anvil-component>
    </label>
    <div>
      <anvil-component type="Button" name="find_button" prop:text="Find a safe spot nearby" prop:role='["btn", "btn-sm", "btn-accent", "ic-shield"]'></anvil-component>
      <div class="bt-spot-results pk-spots" anvil:name="results_box">
        <anvil-component type="RepeatingPanel" name="results" prop:item_template="Better_Than_Marketplace.Items.PlaceRow" prop:role='["spot-results"]'></anvil-component>
        <anvil-component type="Label" name="results_note" prop:role='["fine-print"]'></anvil-component>
      </div>
    </div>
    <p class="pk-tip"><i class="ic ic-shield"></i><span>Many police stations have a safe-trade spot by the door. Meet in daylight, look at the item before you pay, and never pay in advance.</span></p>
    <anvil-component type="Label" name="error" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end dlg-acts">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="send_button" prop:text="Send plan" prop:role='["btn", "btn-primary", "ic-calendar"]'></anvil-component>
    </div>
  </div>
</div>
