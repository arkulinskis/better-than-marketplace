<div class="ui dlg-host">
  <anvil-component type="Label" name="title" prop:role='["dlg-title"]'></anvil-component>
  <anvil-component type="Label" name="text" prop:role='["fine-print", "dlg-text"]'></anvil-component>
  <div class="ui-row bt-spot-tools">
    <anvil-component type="Button" name="locate_button" prop:text="Use my location" prop:role='["btn", "btn-sm", "btn-accent", "ic-pin"]'></anvil-component>
    <div class="bt-spot-search">
      <anvil-component type="TextBox" name="search_box" prop:placeholder="Or search a place"></anvil-component>
      <anvil-component type="Button" name="search_button" prop:text="Search" prop:role='["btn", "btn-sm", "btn-icon", "ic-search"]'></anvil-component>
    </div>
  </div>
  <div class="bt-spot-results" anvil:name="results_box">
    <anvil-component type="RepeatingPanel" name="results" prop:item_template="Better_Than_Marketplace.Items.PlaceRow" prop:role='["spot-results"]'></anvil-component>
    <anvil-component type="Label" name="results_note" prop:role='["fine-print"]'></anvil-component>
  </div>
  <div class="bt-map" anvil:dom-node="map"></div>
  <anvil-component type="Label" name="hint" prop:role='["fine-print", "dlg-hint"]'></anvil-component>
  <label class="ui-field bt-spot-label"><span anvil:name="label_title">Name of the area</span>
    <anvil-component type="TextBox" name="label_box" prop:placeholder="e.g. Mile End, Montréal"></anvil-component>
  </label>
  <anvil-component type="Label" name="error" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  <div class="ui-row end dlg-acts">
    <anvil-component type="Button" name="extra1" prop:role='["btn", "btn-ghost"]' prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="extra2" prop:role='["btn", "btn-ghost"]' prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="ok_button" prop:text="Save" prop:role='["btn", "btn-primary"]'></anvil-component>
  </div>
</div>
