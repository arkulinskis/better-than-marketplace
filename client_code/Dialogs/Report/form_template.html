<div class="ui dlg-host">
  <anvil-component type="Label" name="title" prop:role='["dlg-title"]' prop:text="Report this item"></anvil-component>
  <p class="muted">Our moderators take a look. The seller isn't told who reported it.</p>
  <div class="ui-stack">
    <div class="rp-reasons" role="radiogroup" aria-label="What's wrong?">
      <anvil-component type="RadioButton" name="r_prohibited" prop:text="Not allowed here (weapons, drugs, animals…)" prop:value="prohibited" prop:group_name="reason" prop:selected="true"></anvil-component>
      <anvil-component type="RadioButton" name="r_scam" prop:text="Scam or spam" prop:value="scam" prop:group_name="reason"></anvil-component>
      <anvil-component type="RadioButton" name="r_offensive" prop:text="Offensive" prop:value="offensive" prop:group_name="reason"></anvil-component>
      <anvil-component type="RadioButton" name="r_wrong" prop:text="Misleading photos or info" prop:value="wrong" prop:group_name="reason"></anvil-component>
      <anvil-component type="RadioButton" name="r_other" prop:text="Something else" prop:value="other" prop:group_name="reason"></anvil-component>
    </div>
    <label class="ui-field"><span>Anything to add? <em>(optional)</em></span>
      <anvil-component type="TextArea" name="details_box"></anvil-component>
    </label>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="send_button" prop:text="Send report" prop:role='["btn", "btn-danger", "btn-solid"]'></anvil-component>
    </div>
  </div>
</div>
