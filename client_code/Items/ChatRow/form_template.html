<div class="ms-row-host">
  <a class="ms-row" href="#messages" anvil:name="row">
    <img alt="" anvil:dom-node="img"><span class="ph" anvil:name="ph"></span>
    <span class="grow">
      <anvil-component type="Label" name="title" prop:role='["ms-title"]' bind:text="self.item['title']"></anvil-component>
      <anvil-component type="Label" name="who" prop:role='["ms-who"]'></anvil-component>
      <anvil-component type="Label" name="last" prop:role='["ms-last"]'></anvil-component>
    </span>
    <anvil-component type="Label" name="when" prop:role='["ms-when"]'></anvil-component>
    <anvil-component type="Label" name="dot" prop:role='["ms-dot"]'></anvil-component>
  </a>
</div>
