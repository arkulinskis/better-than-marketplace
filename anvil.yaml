    en_CA\">\n<meta property=\"og:url\" content=\"https://bettermart.anvil.app/\">\n<meta property=\"og:image\" content=\"\
    https://bettermart.anvil.app/_/theme/og-image.png\">\n<meta property=\"og:image:width\" content=\"1200\"><meta property=\"\
    og:image:height\" content=\"630\">\n<meta property=\"og:image:alt\" content=\"Better Than Marketplace: Snap it. Name it.\
    \ Sold. A local marketplace with no fees.\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"\
    twitter:title\" content=\"Better Than Marketplace: sell stuff nearby in 30 seconds\">\n<meta name=\"twitter:description\"\
    \ content=\"Sell the stuff you don&#x27;t need in seconds: snap a photo with your phone, give it a name, done. No categories,\
    \ no forms, no fees. Browse what neighbours sell nearby.\">\n<meta name=\"twitter:image\" content=\"https://bettermart.anvil.app/_/theme/og-image.png\"\
    >\n<link rel=\"alternate\" type=\"text/plain\" title=\"Better Than Marketplace for AI assistants\" href=\"https://bettermart.anvil.app/llms.txt\"\
    >\n<script type=\"application/ld+json\">{\"@context\": \"https://schema.org\", \"@graph\": [{\"@type\": \"WebApplication\"\
    , \"@id\": \"https://bettermart.anvil.app/#app\", \"name\": \"Better Than Marketplace\", \"url\": \"https://bettermart.anvil.app/\"\
