    : \"CAD\"}, \"audience\": {\"@type\": \"Audience\", \"audienceType\": \"Adults (18+) buying and selling second-hand things\
    \ with neighbours\"}}, {\"@type\": \"WebSite\", \"@id\": \"https://bettermart.anvil.app/#site\", \"url\": \"https://bettermart.anvil.app/\"\
    , \"name\": \"Better Than Marketplace\", \"publisher\": {\"@id\": \"https://arkvital.com/#org\"}}, {\"@type\": \"Organization\"\
    , \"@id\": \"https://arkvital.com/#org\", \"name\": \"Arkvital\", \"url\": \"https://arkvital.com\", \"email\": \"arkvital@outlook.com\"\
